name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: tar czf terminal-pet-x86_64-linux.tar.gz -C target/release terminal-pet
      - uses: softprops/action-gh-release@v2
        with:
          files: terminal-pet-x86_64-linux.tar.gz
